[project]
name = "spectro-calendar"
version = "0.1.0"
description = "Generate an HTML spectrogram calendar from passive acoustic recorder WAV recordings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "biodiversica", email = "biodiversica@gmail.com" },
]
keywords = ["audiomoth", "spectrogram", "bioacoustics", "wav", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Environment :: Console",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/biodiversica/spectro-calendar"
Documentation = "https://github.com/biodiversica/spectro-calendar#readme"
Repository = "https://github.com/biodiversica/spectro-calendar"
Issues = "https://github.com/biodiversica/spectro-calendar/issues"

[project.scripts]
spectro-calendar = "spectro_calendar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectro_calendar"]

[tool.hatch.build.targets.sdist]
# Editor and agent settings are per-checkout, not part of the source release.
exclude = [".claude", ".vscode", ".github"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
