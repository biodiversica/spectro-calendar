[project]
name = "spectro-calendar"
version = "0.1.0"
description = "Generate an HTML spectrogram calendar from passive acoustic recorder WAV recordings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "biodiversica", email = "biodiversica@gmail.com" },
]
keywords = ["audiomoth", "spectrogram", "bioacoustics", "wav", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Environment :: Console",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/biodiversica/spectro-calendar"
Repository = "https://github.com/biodiversica/spectro-calendar"
Issues = "https://github.com/biodiversica/spectro-calendar/issues"

[project.scripts]
spectro-calendar = "spectro_calendar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectro_calendar"]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
